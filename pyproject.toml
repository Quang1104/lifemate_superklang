[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lifemate-baseline"
version = "0.1.0"
description = "Offline LifeMate agent scaffold"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.22,<5", "tzdata>=2024.1"]  # Docker base image ships no tz database

[project.optional-dependencies]
model = ["torch>=2.6,<3", "transformers==5.20.2", "numpy>=1.26,<3", "jinja2>=3.1,<4",
         "xgrammar>=0.1.19,<0.2"]  # pin exactly once the Colab-installed version is recorded
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["src.agent*", "src.tooling*", "src.inference*"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_audit"]
